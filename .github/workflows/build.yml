name: Build APK - AKATSUKI MODE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.akatsuki.mode",
            "appName": "AKATSUKI MODE",
            "webDir": "www",
            "server": {
              "url": "https://mohitmahawar74758-png.github.io/Portfolio/",
              "cleartext": true
            }
          }
          EOF
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "no html"
          cp dp.jpg www/ 2>/dev/null || echo "no dp"
          cp manifest.json www/ 2>/dev/null || echo "no manifest"

      - name: Init Capacitor
        run: npx cap init "AKATSUKI MODE" "com.akatsuki.mode" --web-dir=www

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKATSUKI-MODE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
