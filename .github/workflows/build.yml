name: Build APK - AKATSUKI MODE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Setup Project Files
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp dp.jpg www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.akatsuki.mode",
            "appName": "AKATSUKI MODE",
            "webDir": "www",
            "server": {
              "url": "https://mohitmahawar74758-png.github.io/Portfolio/",
              "cleartext": true
            }
          }
          EOF
          cat capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon || true

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKATSUKI-MODE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
