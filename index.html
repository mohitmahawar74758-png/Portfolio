<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRAZY ALPACA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Courier New',monospace;background:#000;color:#00ff41;min-height:100vh;background-image:linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);background-size:20px 20px}
.profile{padding:30px 20px 10px;text-align:center}
.avatar{width:120px;height:120px;border-radius:50%;border:3px solid #00ff41;box-shadow:0 0 20px #00ff41;background:#001a00;display:inline-flex;align-items:center;justify-content:center;font-size:50px}
.name{font-size:28px;font-weight:800;letter-spacing:3px;margin:14px 0 8px;text-shadow:0 0 10px #00ff41}
.badge{display:inline-block;background:rgba(0,255,65,.05);border:1px solid #00ff41;padding:6px 14px;border-radius:4px;font-size:12px}
.container{max-width:480px;margin:0 auto;padding:0 16px 40px}
.card{background:rgba(0,10,0,.8);border:1px solid #00ff41;border-radius:4px;padding:18px;margin-bottom:14px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;width:15px;height:15px;border-top:2px solid #00ff41;border-left:2px solid #00ff41}
.card::after{content:'';position:absolute;bottom:0;right:0;width:15px;height:15px;border-bottom:2px solid #00ff41;border-right:2px solid #00ff41}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:3px;font-weight:700;margin-bottom:12px}
.card-title::before{content:'> '}
textarea,input[type=text]{width:100%;background:#000;color:#00ff41;border:1px solid #00ff41;border-radius:4px;padding:12px;font-family:'Courier New',monospace;font-size:11px;outline:none;margin-top:8px}
textarea{min-height:120px;resize:vertical}
input[type=text]{padding:10px;font-size:12px}
textarea::placeholder,input::placeholder{color:#004d14}
button{width:100%;padding:15px;border:2px solid #00ff41;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:monospace;letter-spacing:2px;background:rgba(0,20,0,.8);color:#00ff41;text-transform:uppercase;transition:all .2s}
button:active{background:rgba(0,255,65,.15);box-shadow:0 0 25px #00ff41}
.btn-quit{background:rgba(0,20,0,.8);border-color:#00ff41;color:#00ff41}
.btn-danger{background:rgba(40,0,0,.8);border-color:#ff003c;color:#ff003c;font-size:16px;padding:18px}
.btn-ghost{background:rgba(0,20,0,.6);border:1px solid #00ff41;font-size:11px;padding:10px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:rgba(0,10,0,.8);padding:10px;border-radius:4px;border:1px solid #00ff41;margin-bottom:8px}
.info-label{font-size:9px;color:#008833;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.info-value{font-size:12px;word-break:break-all}
.status-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(0,10,0,.8);border:1px solid #00ff41;border-radius:4px;margin-bottom:14px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#ff003c}
.dot.on{background:#00ff41}
#log{background:#000;font-size:10.5px;padding:12px;border-radius:4px;height:200px;overflow-y:auto;border:1px solid #00ff41;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.ok{color:#00ff41}.err{color:#ff003c}.warn{color:#ffcc00}.info{color:#00ccff}
.hidden{display:none}
.uid-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.uid-badge{background:rgba(0,255,65,.05);border:1px solid #00ff41;padding:5px 10px;border-radius:4px;font-size:11px}
/* Custom file button */
.file-wrap{position:relative;display:block;margin-top:10px}
.file-wrap input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px dashed #00ff41;border-radius:4px;color:#00ff41;font-family:monospace;font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase;background:rgba(0,20,0,0.4);transition:all 0.2s}
.file-wrap:active .file-label{background:rgba(0,255,65,0.15)}
</style>
</head>
<body>

<div class="profile">
  <div class="avatar">🦙</div>
  <div class="name">CRAZY ALPACA</div>
  <div class="badge">WePlay Exit Tool</div>
</div>

<div class="container">

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span id="statusText">DISCONNECTED</span>
  </div>

  <div class="card">
    <div class="card-title">WebSocket Dump Paste</div>
    <p style="font-size:11px;color:#888;margin-bottom:8px;">Apna dump paste karo — UID, Secret, RID sab auto-detect hoga</p>
    <textarea id="dumpInput" placeholder=">>> Poora Crazy Alpaca dump yahan paste karo..."></textarea>

    <!-- CUSTOM FILE BUTTON -->
    <label class="file-wrap">
      <input type="file" id="dumpFile" accept=".txt,.json,.log,text/*">
      <span class="file-label">📁 LOAD FILE</span>
    </label>

    <button class="btn-ghost" onclick="clearDump()">🗑️ Clear Dump</button>
    <button onclick="parseDump()">⚡ CONNECT</button>
  </div>

  <div class="card hidden" id="infoCard">
    <div class="card-title">Detected</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">My UID</div><div class="info-value" id="infoMyUid">-</div></div>
      <div class="info-item"><div class="info-label">RID</div><div class="info-value" id="infoRid">-</div></div>
    </div>
    <div class="info-item">
      <div class="info-label">Secret</div>
      <div class="info-value" id="infoSecret" style="font-size:10px;">-</div>
    </div>
    <div class="info-item">
      <div class="info-label">Players (<span id="playerCount">0</span>)</div>
      <div class="uid-list" id="infoUids"></div>
    </div>
    <div class="info-item">
      <div class="info-label">✏️ Manual UIDs (agar auto-detect fail ho)</div>
      <input type="text" id="manualUids" placeholder="UID1, UID2, UID3">
      <button class="btn-ghost" onclick="useManualUids()">✅ Use Manual</button>
    </div>
  </div>

  <div class="card hidden" id="exitCard">
    <div class="card-title">Exit Controls</div>
    <div id="exitButtons"></div>
  </div>

  <div class="card">
    <div class="card-title">Live Log</div>
    <div id="log">Ready...</div>
    <button class="btn-ghost" onclick="clearLog()">🗑️ Clear Log</button>
  </div>

</div>

<script>
const REGISTER_CMD = "CMD_HEART_BEAT";
const EXIT_CMD = "CMD_QUIT";

let WS_URL = '';
let MY_UID = 0;
let SECRET = '';
let parsed = { rid: null, uids: [] };
let ws = null;
let pid = 1;

function log(msg, type) {
  const el = document.getElementById('log');
  const cls = type || '';
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(c) {
  document.getElementById('dot').className = 'dot' + (c ? ' on' : '');
  document.getElementById('statusText').textContent = c ? 'CONNECTED' : 'DISCONNECTED';
}

function clearDump() {
  document.getElementById('dumpInput').value = '';
  document.getElementById('dumpFile').value = '';
  log('Dump cleared ✅', 'info');
}
function clearLog() { document.getElementById('log').innerHTML = ''; log('Log cleared ✅', 'info'); }

// File input handler
document.getElementById('dumpFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('dumpInput').value = ev.target.result;
    log(`📁 File loaded: ${file.name} (${ev.target.result.length} chars)`, 'ok');
  };
  reader.onerror = () => log('❌ File read error', 'err');
  reader.readAsText(file);
});

function parseDump() {
  const raw = document.getElementById('dumpInput').value.trim();
  if (!raw) { log('Dump paste karo', 'err'); return; }
  log(`Parsing dump (${raw.length} chars)...`, 'info');

  // ============================================
  // UID DETECTION — universal (player ya observer)
  // ============================================
  let myUid = null;
  let uidSource = '';

  const sessionCmds = ['CMD_HEART_BEAT', 'CMD_SYNC', 'CMD_MICROPHONE_STATE', 'CMD_QUIT', 'CMD_READY', 'CMD_START'];
  for (const cmd of sessionCmds) {
    const re = new RegExp(`"command"\\s*:\\s*"${cmd}"\\s*,\\s*"param"\\s*:\\s*\\{[^}]*?"uid"\\s*:\\s*(\\d+)`);
    const m = raw.match(re);
    if (m) {
      myUid = parseInt(m[1]);
      uidSource = cmd;
      break;
    }
  }

  if (!myUid) {
    const m = raw.match(/"my_uid"\s*:\s*(\d+)/)
           || raw.match(/"self_uid"\s*:\s*(\d+)/)
           || raw.match(/"login_uid"\s*:\s*(\d+)/)
           || raw.match(/"player_uid"\s*:\s*(\d+)/);
    if (m) { myUid = parseInt(m[1]); uidSource = 'my_uid key'; }
  }

  if (!myUid) {
    const gamersIdx = raw.indexOf('"gamers"');
    if (gamersIdx !== -1) {
      const gamersEnd = raw.indexOf(']', gamersIdx);
      if (gamersEnd !== -1) {
        const outside = raw.slice(0, gamersIdx) + raw.slice(gamersEnd + 1);
        const m = outside.match(/"uid"\s*:\s*(\d+)/);
        if (m) { myUid = parseInt(m[1]); uidSource = 'outside gamers'; }
      }
    }
    if (!myUid) {
      const m = raw.match(/"uid"\s*:\s*(\d+)/);
      if (m) { myUid = parseInt(m[1]); uidSource = 'first uid (fallback)'; }
    }
  }

  if (!myUid) {
    log('❌ UID detect nahi ho paya — manual UIDs use karo', 'err');
    return;
  }
  MY_UID = myUid;
  log(`✅ My UID: ${MY_UID} (source: ${uidSource})`, 'ok');

  const secretMatch = raw.match(/"secret"\s*:\s*"([^"]+)"/i);
  if (secretMatch) {
    SECRET = secretMatch[1];
    log(`✅ Secret: ${SECRET.substring(0, 8)}...`, 'ok');
  } else {
    log('⚠️ Secret nahi mila', 'warn');
  }

  const ridMatch = raw.match(/"rid"\s*:\s*(\d+)/);
  if (ridMatch) {
    parsed.rid = parseInt(ridMatch[1]);
    log(`✅ RID: ${parsed.rid}`, 'ok');
  } else {
    log('❌ RID nahi mila', 'err');
    return;
  }

  const wsMatch = raw.match(/(wss?:\/\/[^\s"']+)/);
  if (wsMatch) {
    WS_URL = wsMatch[1];
    log(`✅ WS: ${WS_URL}`, 'ok');
  } else {
    WS_URL = 'ws://35.154.196.40:14501/ws';
    log(`⚠️ Default WS: ${WS_URL}`, 'warn');
  }

  const detectedUids = new Set();

  const gamersMatch = raw.match(/"gamers"\s*:\s*\[([\s\S]*?)\]\s*,\s*"mode"/);
  if (gamersMatch) {
    [...gamersMatch[1].matchAll(/"uid"\s*:\s*(\d+)/g)].forEach(m => {
      const u = parseInt(m[1]);
      if (u !== MY_UID && u > 100000000) detectedUids.add(u);
    });
  }

  if (detectedUids.size === 0) {
    const gamersIdx = raw.indexOf('"gamers"');
    if (gamersIdx !== -1) {
      const gamersEnd = raw.indexOf(']', gamersIdx);
      if (gamersEnd !== -1) {
        const gamersBlock = raw.slice(gamersIdx, gamersEnd);
        [...gamersBlock.matchAll(/"uid"\s*:\s*(\d+)/g)].forEach(m => {
          const u = parseInt(m[1]);
          if (u !== MY_UID && u > 100000000) detectedUids.add(u);
        });
      }
    }
  }

  [...raw.matchAll(/"remove_progress"\s*:\s*\{[^}]*"uid"\s*:\s*(\d+)/g)].forEach(m => {
    const u = parseInt(m[1]);
    if (u !== MY_UID && u > 100000000) detectedUids.add(u);
  });

  parsed.uids = [...detectedUids].slice(0, 6);

  document.getElementById('infoMyUid').textContent = MY_UID;
  document.getElementById('infoRid').textContent = parsed.rid || '❌';
  document.getElementById('infoSecret').textContent = SECRET ? SECRET.substring(0, 20) + '...' : '❌';
  document.getElementById('playerCount').textContent = parsed.uids.length;
  document.getElementById('infoUids').innerHTML = parsed.uids.map((u, i) => 
    `<span class="uid-badge">${i+1}. ${u}</span>`).join('') 
    || '<span style="color:#ffcc00;">⚠️ Koi UID nahi mili — manual daalo</span>';
  document.getElementById('infoCard').classList.remove('hidden');

  buildExitButtons();

  log(`━━━━━━━━━━━━━━━━━━━━━━`, 'info');
  log(`📱 My UID: ${MY_UID}`, 'ok');
  log(`🔑 Secret: ${SECRET ? 'YES' : 'NO'}`, SECRET ? 'ok' : 'err');
  log(`🏠 RID: ${parsed.rid}`, 'ok');
  log(`👥 Players: ${parsed.uids.length}`, 'ok');
  log(`━━━━━━━━━━━━━━━━━━━━━━`, 'info');

  if (parsed.rid && parsed.uids.length > 0 && SECRET) {
    setTimeout(connect, 500);
  } else {
    if (!SECRET) log('⚠️ Secret nahi mila — CONNECT nahi hoga', 'warn');
    if (!parsed.uids.length) log('⚠️ Koi player nahi — manual UIDs daalo', 'warn');
  }
}

function buildExitButtons() {
  const container = document.getElementById('exitButtons');
  const count = parsed.uids.length;
  let html = '';
  if (count === 0) {
    html = `<div style="color:#ffcc00;padding:10px;text-align:center;">⚠️ Koi player nahi</div>`;
  } else {
    for (let i = 0; i < count; i++) {
      html += `<button class="btn-quit" onclick="quitUid(${i})">▶ PLAYER ${i+1} EXIT (${parsed.uids[i]})</button>`;
    }
    html += `<button class="btn-danger" onclick="quitAll()">💀 SAB EXIT KARO</button>`;
  }
  container.innerHTML = html;
  document.getElementById('exitCard').classList.remove('hidden');
  log(`✅ ${count} exit buttons`, 'ok');
}

function useManualUids() {
  const input = document.getElementById('manualUids').value.trim();
  if (!input) { log('Manual UIDs daalo', 'err'); return; }
  const uids = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n !== MY_UID);
  if (uids.length === 0) { log('Invalid', 'err'); return; }
  parsed.uids = uids.slice(0, 6);
  document.getElementById('playerCount').textContent = parsed.uids.length;
  document.getElementById('infoUids').innerHTML = parsed.uids.map((u, i) => 
    `<span class="uid-badge">${i+1}. ${u}</span>`).join('');
  buildExitButtons();
  log(`✅ Manual UIDs set`, 'ok');
  if (parsed.rid && SECRET) connect();
}

function connect() {
  if (!WS_URL) { log('❌ WS URL nahi hai', 'err'); return; }
  if (!SECRET) { log('❌ Secret nahi hai', 'err'); return; }
  if (!parsed.rid) { log('❌ RID nahi hai', 'err'); return; }
  if (ws && ws.readyState === 1) { log('ℹ️ Already connected', 'info'); return; }

  log(`Connecting to ${WS_URL}...`, 'info');
  ws = new WebSocket(WS_URL);
  pid = 1;

  ws.onopen = () => {
    log('✅ Connected!', 'ok');
    setStatus(true);
    ws.send(JSON.stringify({
      packet_id: pid++,
      command: REGISTER_CMD,
      param: { secret: SECRET, accept_encoding: 0, rid: parsed.rid, uid: MY_UID }
    }));
    log(`📤 REGISTER uid=${MY_UID} rid=${parsed.rid}`, 'info');
  };

  ws.onmessage = (e) => {
    try {
      const j = JSON.parse(e.data);
      if (j.code !== undefined) {
        const cls = j.code === 200 ? 'ok' : 'err';
        log(`[${j.packet_id}] code:${j.code} ${j.message || ''}`, cls);
      }
      if (j.event === 12 && j.message?.remove_progress?.uid) {
        log(`🎯 ${j.message.remove_progress.uid} EXIT!`, 'ok');
      }
    } catch (err) {}
  };

  ws.onerror = (e) => log(`❌ WS Error`, 'err');
  ws.onclose = () => { log('🔒 Closed', 'warn'); setStatus(false); };
}

function quitUid(i) {
  if (i >= parsed.uids.length) { log(`Player ${i+1} nahi`, 'err'); return; }
  log(`Quitting ${parsed.uids[i]}...`, 'info');
  quitInNewConnection(parsed.uids[i]);
}

function quitAll() {
  if (parsed.uids.length === 0) { log('Koi UID nahi', 'err'); return; }
  log(`Exit all ${parsed.uids.length} players`, 'info');
  parsed.uids.forEach((uid, i) => setTimeout(() => quitInNewConnection(uid), i * 2500));
}

function quitInNewConnection(targetUid) {
  log(`→ New conn (${targetUid})`, 'info');
  const tmpWs = new WebSocket(WS_URL);
  let tmpPid = 1;
  let registered = false;

  tmpWs.onopen = () => {
    tmpWs.send(JSON.stringify({
      packet_id: tmpPid++,
      command: REGISTER_CMD,
      param: { secret: SECRET, accept_encoding: 0, rid: parsed.rid, uid: MY_UID }
    }));
  };

  tmpWs.onmessage = (e) => {
    try {
      const j = JSON.parse(e.data);
      if (j.code !== undefined) {
        const cls = j.code === 200 ? 'ok' : 'err';
        log(`   [${j.packet_id}] code:${j.code} ${j.message || ''}`, cls);
      }
      if (j.packet_id === 1 && j.code === 200 && !registered) {
        registered = true;
        setTimeout(() => {
          tmpWs.send(JSON.stringify({
            packet_id: tmpPid++,
            command: EXIT_CMD,
            param: { rid: parsed.rid, uid: targetUid }
          }));
          log(`   📤 ${EXIT_CMD} -> ${targetUid}`, 'warn');
        }, 500);
        setTimeout(() => tmpWs.close(), 4000);
      }
      if (j.event === 12 && j.message?.remove_progress?.uid === targetUid) {
        log(`   🎯 ${targetUid} EXIT HO GAYA!`, 'ok');
      }
    } catch (err) {}
  };

  tmpWs.onerror = () => log(`   Error`, 'err');
  tmpWs.onclose = () => log(`   🔒 Closed`, 'info');
}
</script>

</body>
</html>
