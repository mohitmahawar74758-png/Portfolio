<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>𝕺𝖇𝖎𝖙𝖔 𝖀𝖈𝖍𝖎𝖍𝖆</title>
<meta name="theme-color" content="#dc2626">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; line-height: 1.6; overflow-x: hidden; }
.container { max-width: 900px; margin: 0 auto; padding: 0 24px; }

.lock { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 9999; background: radial-gradient(ellipse at top, #1a0a1a 0%, #0a0a0a 60%); overflow-y: auto; }
.lock h1 { font-size: 30px; margin-bottom: 10px; background: linear-gradient(135deg, #dc2626, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; }
.lock .sub { color: #666; font-size: 13px; letter-spacing: 3px; margin-bottom: 20px; }
.lock .did-box { background: #141414; border: 2px solid #dc2626; border-radius: 12px; padding: 20px 24px; margin: 12px 0; max-width: 400px; width: 100%; position: relative; }
.lock .did-label { font-size: 11px; color: #666; letter-spacing: 3px; margin-bottom: 8px; }
.lock .did-value { font-size: 16px; font-family: monospace; color: #fca5a5; word-break: break-all; letter-spacing: 1px; padding-right: 40px; }
.copy-btn { position: absolute; right: 12px; bottom: 20px; background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.4); color: #fca5a5; font-size: 18px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lock button.primary { padding: 14px 40px; border-radius: 8px; border: none; background: linear-gradient(135deg, #dc2626, #7c3aed); color: white; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 2px; margin-top: 16px; }
.lock button.request { padding: 12px 30px; border-radius: 8px; border: 1px solid #444; background: transparent; color: #a5b4fc; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 1px; margin-top: 10px; }
.lock .status { margin-top: 16px; font-size: 13px; color: #fbbf24; min-height: 24px; max-width: 400px; }
.lock .status.err { color: #f87171; }
.lock .status.ok { color: #4ade80; }
.lock .icon { font-size: 60px; margin-bottom: 20px; }

.copy-toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #14532d; color: #86efac; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 99999; }
.copy-toast.show { opacity: 1; }

.hidden { display: none !important; }
.hero { min-height: 100vh; display: flex; align-items: center; padding: 60px 0 40px; background: radial-gradient(ellipse at top, #1a0a1a 0%, #0a0a0a 60%); }
.hero-inner { display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center; }
.avatar { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; flex-shrink: 0; box-shadow: 0 20px 60px rgba(220, 38, 38, 0.4); border: 4px solid #dc2626; background: linear-gradient(135deg, #dc2626, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 800; color: white; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
.hero-text { max-width: 600px; }
.hero-text h1 { font-size: 44px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #fff, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; word-break: break-word; letter-spacing: 3px; line-height: 1.2; }
.hero-text .tagline { font-size: 17px; color: #888; margin-bottom: 24px; }
.hero-text .uid-box { display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px 8px 18px; background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); border-radius: 100px; font-size: 14px; color: #fca5a5; font-family: monospace; margin-bottom: 24px; }
.uid-copy-btn { background: rgba(220, 38, 38, 0.3); border: 1px solid rgba(220, 38, 38, 0.5); color: #fca5a5; font-size: 14px; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.uid-copy-btn:active { background: rgba(220, 38, 38, 0.6); transform: scale(0.9); }
.hero-text .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; justify-content: center; }
.badge { padding: 7px 16px; background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); border-radius: 100px; font-size: 13px; color: #fca5a5; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 13px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; display: inline-block; border: none; transition: all 0.2s; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, #dc2626, #7c3aed); color: white; }
.btn-outline { background: transparent; border: 2px solid #333; color: #e5e5e5; }

section { padding: 60px 0; min-height: 100px; }
.section-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }
.section-title::before { content: ''; width: 4px; height: 28px; background: linear-gradient(135deg, #dc2626, #7c3aed); border-radius: 2px; }
.empty-text { color: #444; font-size: 13px; font-style: italic; padding: 20px 0; }

footer { padding: 40px 0; text-align: center; color: #555; font-size: 14px; border-top: 1px solid #1a1a1a; }

@media (max-width: 600px) {
  .hero-text h1 { font-size: 30px; }
  .avatar { width: 150px; height: 150px; }
  .section-title { font-size: 22px; }
}
</style>
</head>
<body>

<div class="copy-toast" id="copyToast">✅ Copied!</div>

<div class="lock" id="lockScreen">
  <div class="icon">🔒</div>
  <h1>𝕺𝖇𝖎𝖙𝖔 𝖀𝖈𝖍𝖎𝖍𝖆</h1>
  <div class="sub">ACCESS REQUIRED</div>
  
  <div class="did-box">
    <div class="did-label">YOUR DEVICE ID</div>
    <div class="did-value" id="deviceIdBox">Loading...</div>
    <button class="copy-btn" onclick="copyDeviceId()">📋</button>
  </div>
  
  <p style="font-size: 12px; color: #888; max-width: 400px;">ID copy karo owner ko bhejo. Ya REQUEST dabao.</p>
  
  <button class="primary" onclick="checkApproval()">✅ CHECK APPROVAL</button>
  <button class="request" onclick="requestAccess()">📩 REQUEST ACCESS</button>
  
  <div class="status" id="lockStatus">Waiting for approval...</div>
</div>

<div id="mainApp" class="hidden">
  <div class="hero">
    <div class="container">
      <div class="hero-inner">
        <div class="avatar" id="avatarBox">𝕺</div>
        <div class="hero-text">
          <h1>𝕺𝖇𝖎𝖙𝖔 𝖀𝖈𝖍𝖎𝖍𝖆</h1>
          <p class="tagline">Gamer • App Developer • Digital Creator</p>
          <div class="uid-box">
            <span>UID: 384969427</span>
            <button class="uid-copy-btn" onclick="copyUid()" title="Copy UID">📋</button>
          </div>
          <div class="badges">
            <span class="badge">🎮 Gamer</span>
            <span class="badge">💻 Developer</span>
            <span class="badge">🎨 Creator</span>
          </div>
          <div class="cta">
            <a href="weplay://" class="btn btn-primary">Contact Me on WePlay</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <footer>© 2026 𝕺𝖇𝖎𝖙𝖔 𝖀𝖈𝖍𝖎𝖍𝖆</footer>
</div>

<script>
// ============================================
// FIREBASE
// ============================================
const FIREBASE_URL = 'https://obito-app-default-rtdb.firebaseio.com';
const WHITELIST_URL = 'https://api.github.com/repos/obito-uchiha-07/Portfolio/contents/whitelist.json';
const MY_UID = '384969427';

// ============ DEVICE ID ============
function getDeviceId() {
  let id = localStorage.getItem('obito_device_id');
  if (!id) {
    const rand = Math.random().toString(36).substr(2, 6).toUpperCase();
    const time = Date.now().toString(36).toUpperCase().slice(-4);
    id = 'OB-' + rand + '-' + time;
    localStorage.setItem('obito_device_id', id);
  }
  return id;
}

const DEVICE_ID = getDeviceId();
document.getElementById('deviceIdBox').textContent = DEVICE_ID;

// ============ COPY DEVICE ID ============
function copyDeviceId() {
  copyText(DEVICE_ID, 'Device ID');
}

// ============ COPY UID ============
function copyUid() {
  copyText(MY_UID, 'WePlay UID');
}

function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopyToast(label + ' copied!')).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showCopyToast(label + ' copied!'); } catch(e) { alert('Copy: ' + text); }
    document.body.removeChild(ta);
  }
}

function showCopyToast(msg) {
  const toast = document.getElementById('copyToast');
  toast.textContent = '✅ ' + msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ CHECK APPROVAL ============
async function checkApproval() {
  const status = document.getElementById('lockStatus');
  status.textContent = '⏳ Checking...';
  status.className = 'status';
  try {
    const res = await fetch(WHITELIST_URL + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    const decoded = JSON.parse(atob(data.content.replace(/\n/g, '')));
    const approved = decoded.approved || [];
    if (approved.includes(DEVICE_ID)) {
      status.textContent = '✅ APPROVED! Opening...';
      status.className = 'status ok';
      setTimeout(() => {
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        loadAvatar();
      }, 800);
    } else {
      status.textContent = '❌ Not approved yet.';
      status.className = 'status err';
    }
  } catch (e) {
    status.textContent = '⚠️ Error: ' + e.message;
    status.className = 'status err';
  }
}

// ============ REQUEST ACCESS ============
async function requestAccess() {
  const status = document.getElementById('lockStatus');
  status.textContent = '📩 Sending request...';
  status.className = 'status';
  
  let ip = 'unknown';
  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    ip = d.ip;
  } catch(e) {}
  
  const requestData = {
    deviceId: DEVICE_ID,
    time: new Date().toLocaleString('en-IN'),
    timestamp: Date.now(),
    platform: navigator.platform || 'unknown',
    deviceInfo: navigator.userAgent.match(/\(([^)]+)\)/)?.[1] || 'unknown',
    browser: navigator.userAgent,
    screen: window.screen.width + 'x' + window.screen.height,
    language: navigator.language || 'unknown',
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
    ip: ip,
    status: 'pending'
  };
  
  try {
    const key = DEVICE_ID.replace(/[^A-Z0-9-]/g, '');
    const res = await fetch(FIREBASE_URL + '/requests/' + key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestData)
    });
    if (res.ok) {
      status.textContent = '✅ Request sent! Owner approve karega.';
      status.className = 'status ok';
    } else {
      status.textContent = '❌ Failed. Try again.';
      status.className = 'status err';
    }
  } catch (e) {
    status.textContent = '⚠️ Error: ' + e.message;
    status.className = 'status err';
  }
}

setTimeout(checkApproval, 1000);

function loadAvatar() {
  const box = document.getElementById('avatarBox');
  const names = ['dp.jpg', 'dp.jpeg', 'dp.png'];
  let i = 0;
  function next() {
    if (i >= names.length) return;
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.onerror = () => { i++; next(); };
    img.src = names[i] + '?t=' + Date.now();
  }
  next();
}
</script>

</body>
</html>
