<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; padding: 20px; }
.container { max-width: 500px; margin: 0 auto; }
h1 { font-size: 24px; margin-bottom: 8px; color: #a5b4fc; }
.sub { color: #666; font-size: 13px; margin-bottom: 30px; letter-spacing: 2px; }
.card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
input { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #e5e5e5; font-size: 14px; font-family: monospace; margin-bottom: 12px; outline: none; }
input:focus { border-color: #667eea; }
button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 100%; }
.btn-primary:active { transform: scale(0.98); }
.btn-danger { background: #7f1d1d; color: #fca5a5; font-size: 12px; padding: 6px 12px; }
.btn-approve { background: #14532d; color: #86efac; width: 100%; margin-bottom: 8px; }
.btn-remove { background: #450a0a; color: #fca5a5; width: 100%; }
.device-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0a0a0a; border-radius: 8px; margin-bottom: 8px; border: 1px solid #222; gap: 8px; }
.device-id { font-family: monospace; font-size: 13px; color: #a5b4fc; word-break: break-all; flex: 1; }
.status { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
.status.show { display: block; }
.status.ok { background: #14532d; color: #86efac; }
.status.err { background: #450a0a; color: #fca5a5; }
.hidden { display: none !important; }
.lock-icon { font-size: 48px; text-align: center; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="container">

<div id="gate">
<div class="lock-icon">🔐</div>
<h1 style="text-align:center;">Admin Panel</h1>
<p class="sub" style="text-align:center;">ACCESS REQUIRED</p>
<div class="card">
<input type="password" id="passInput" placeholder="Enter admin passcode" />
<button class="btn-primary" onclick="unlock()">🔓 Unlock</button>
<div class="status err" id="gateStatus"></div>
</div>
</div>

<div id="admin" class="hidden">
<h1>⚙️ Admin Panel</h1>
<p class="sub">OBITO UCHIHA — CONTROL</p>

<div class="card" id="tokenCard">
<h2>🔑 GitHub Token</h2>
<input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" />
<button class="btn-primary" onclick="saveToken()">Save Token</button>
<div class="status" id="tokenStatus"></div>
</div>

<div class="card" id="approveCard">
<h2>✅ Approve / Remove</h2>
<input type="text" id="deviceInput" placeholder="OB-XXXXXX-XXXX" />
<button class="btn-approve" onclick="approveDevice()">✅ APPROVE</button>
<button class="btn-remove" onclick="removeDevice()">❌ REMOVE</button>
<div class="status" id="actionStatus"></div>
</div>

<div class="card">
<h2>📋 Approved Devices</h2>
<button class="btn-primary" style="margin-bottom:16px;" onclick="loadList()">🔄 Refresh</button>
<div id="deviceList">Loading...</div>
</div>
</div>

</div>

<script>
const OWNER = 'mohitmahawar74758-png';
const REPO = 'Portfolio';
const FILE = 'whitelist.json';
const BRANCH = 'main';
const PASSCODE = 'obito418061';

function unlock() {
  const pass = document.getElementById('passInput').value;
  const status = document.getElementById('gateStatus');
  if (pass === PASSCODE) {
    sessionStorage.setItem('unlocked', 'yes');
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    checkToken();
  } else {
    status.textContent = '❌ Wrong passcode';
    status.classList.add('show');
  }
}

if (sessionStorage.getItem('unlocked') === 'yes') {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('admin').classList.remove('hidden');
  checkToken();
}

function checkToken() {
  const token = localStorage.getItem('gh_token');
  if (token) {
    document.getElementById('tokenCard').classList.add('hidden');
    loadList();
  } else {
    document.getElementById('approveCard').classList.add('hidden');
  }
}

function saveToken() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token || !token.startsWith('ghp_')) {
    showStatus('tokenStatus', '❌ Invalid token', 'err');
    return;
  }
  localStorage.setItem('gh_token', token);
  showStatus('tokenStatus', '✅ Token saved!', 'ok');
  setTimeout(() => {
    document.getElementById('tokenCard').classList.add('hidden');
    document.getElementById('approveCard').classList.remove('hidden');
    loadList();
  }, 800);
}

async function getFile() {
  const token = localStorage.getItem('gh_token');
  const res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH + '&t=' + Date.now(), {
    headers: { 'Authorization': 'token ' + token }
  });
  if (!res.ok) throw new Error('Fetch failed');
  const data = await res.json();
  const content = JSON.parse(atob(data.content));
  return { content, sha: data.sha };
}

async function updateFile(newContent, sha) {
  const token = localStorage.getItem('gh_token');
  const res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'Update whitelist ' + new Date().toISOString(),
      content: btoa(JSON.stringify(newContent, null, 2)),
      sha: sha,
      branch: BRANCH
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'Update failed');
  }
  return await res.json();
}

async function approveDevice() {
  const deviceId = document.getElementById('deviceInput').value.trim();
  if (!deviceId) { showStatus('actionStatus', '❌ Device ID daalo', 'err'); return; }
  showStatus('actionStatus', '⏳ Approving...', 'ok');
  try {
    const { content, sha } = await getFile();
    if (!content.approved) content.approved = [];
    if (content.approved.includes(deviceId)) {
      showStatus('actionStatus', '⚠️ Already approved', 'err');
      return;
    }
    content.approved.push(deviceId);
    await updateFile(content, sha);
    showStatus('actionStatus', '✅ Approved: ' + deviceId, 'ok');
    document.getElementById('deviceInput').value = '';
    setTimeout(loadList, 1000);
  } catch (e) {
    showStatus('actionStatus', '❌ Error: ' + e.message, 'err');
  }
}

async function removeDevice() {
  const deviceId = document.getElementById('deviceInput').value.trim();
  if (!deviceId) { showStatus('actionStatus', '❌ Device ID daalo', 'err'); return; }
  showStatus('actionStatus', '⏳ Removing...', 'ok');
  try {
    const { content, sha } = await getFile();
    if (!content.approved || !content.approved.includes(deviceId)) {
      showStatus('actionStatus', '⚠️ ID not in list', 'err');
      return;
    }
    content.approved = content.approved.filter(id => id !== deviceId);
    await updateFile(content, sha);
    showStatus('actionStatus', '✅ Removed: ' + deviceId, 'ok');
    document.getElementById('deviceInput').value = '';
    setTimeout(loadList, 1000);
  } catch (e) {
    showStatus('actionStatus', '❌ Error: ' + e.message, 'err');
  }
}

async function loadList() {
  const list = document.getElementById('deviceList');
  list.innerHTML = '⏳ Loading...';
  try {
    const { content } = await getFile();
    const approved = content.approved || [];
    if (approved.length === 0) {
      list.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">No devices approved</div>';
      return;
    }
    list.innerHTML = approved.map(id => 
      '<div class="device-item"><span class="device-id">' + id + '</span><button class="btn-danger" onclick="quickRemove(\'' + id + '\')">❌ Remove</button></div>'
    ).join('');
  } catch (e) {
    list.innerHTML = '<div style="color:#fca5a5;">❌ Error: ' + e.message + '</div>';
  }
}

async function quickRemove(deviceId) {
  if (!confirm('Remove ' + deviceId + '?')) return;
  try {
    const { content, sha } = await getFile();
    content.approved = (content.approved || []).filter(id => id !== deviceId);
    await updateFile(content, sha);
    loadList();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status show ' + type;
  if (type === 'ok') setTimeout(() => { el.classList.remove('show'); }, 3000);
}
</script>

</body>
</html>
